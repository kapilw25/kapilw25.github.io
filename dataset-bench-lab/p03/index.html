function cell(r,c,best){ var k=c.k, a;
  if(c.type==="name") return '<td class="name">'+hl(CUR==="survey"?r.name:r.id)+(r.table1?'<span class="tag" title="one of our Table 1 tests">Table 1</span>':"")+"</td>";
  if(c.type==="links"){ a=[]; if(r.arxiv) a.push('<a href="https://arxiv.org/abs/'+esc(r.arxiv)+'" target="_blank" rel="noopener">arXiv</a>');
    ["page","code","data"].forEach(function(x){ if(r[x]) a.push('<a href="'+esc(r[x])+'" target="_blank" rel="noopener">'+x+"</a>"); });
    return '<td class="links">'+(a.join("")||'<span class="note">none yet</span>')+"</td>"; }
  if(c.type==="ynp") return "<td>"+ynp(r[k])+"</td>";
  if(c.type==="score"){ var v=r[k]; return '<td class="num'+(v!=null&&v===best?" best":"")+'">'+(v==null?"&ndash;":v.toFixed(1))+"</td>"; }
  if(c.type==="threat"){ var t=r.threat, cls=t==="ours"?"ours":t==="no"?"no":t==="partly"?"partly":"na", lab=t==="ours"?"ours":t==="no"?"no threat":t==="partly"?"partly":"n/a";
    return '<td><span class="b t '+cls+'">'+lab+'</span> <span class="note">'+hl(r.threat_note||"")+"</span></td>"; }
  if(c.type==="status") return '<td class="status"><span class="b s '+r.now+'">'+r.now+'</span> → <span class="b s '+r.after+'">'+r.after+'</span><div class="note">'+hl(r.status_note||"")+"</div></td>";
  if(c.type==="evidence") return '<td class="ev">'+(r.evidence||[]).map(function(e){return '<a href="'+esc(e.url)+'" target="_blank" rel="noopener">'+hl(e.label)+"</a>";}).join("")+"</td>";
  var cls=c.type==="strong"?"strong":c.type==="quote"?"quote":c.type==="wide"?"wide":c.type==="mid"?"mid":"";
  return "<td"+(cls?' class="'+cls+'"':"")+">"+hl(text(r,c))+"</td>"; }
var thead=document.querySelector("#t thead"), tbody=document.querySelector("#t tbody");
function vis(){ return V().cols.filter(function(c){ return S().hidden.indexOf(c.k)<0; }); }
function renderTabs(){ var top=V().top;
  document.getElementById("tabs").innerHTML=TOPS.map(function(t){ return '<button role="tab" data-top="'+t.id+'" aria-selected="'+(t.id===top)+'">'+esc(t.l)+"</button>"; }).join("");
  var T=TOPS.filter(function(t){return t.id===top;})[0];
  document.getElementById("subtabs").innerHTML=T.subs.map(function(s){ return '<button role="tab" data-view="'+s+'" aria-selected="'+(s===CUR)+'">'+esc(VIEWS[s].label)+"</button>"; }).join(""); }
function renderHeader(){ var v=V(); document.getElementById("h1").textContent=v.title; document.getElementById("intro").innerHTML=v.intro;
  document.getElementById("stats").innerHTML=v.stats(v.rows).map(function(s){return '<div class="stat"><b>'+s[0]+"</b> "+s[1]+"</div>";}).join("");
  document.getElementById("foot").innerHTML=v.foot; }
function renderFacets(){ var v=V(), s=S();
  document.getElementById("facets").innerHTML=v.facets.map(function(f){ var all=values(v,f.k), sel=s.sel[f.k];
    var h='<div class="row facet" role="group" aria-label="'+esc(f.l)+'"><span class="lab">'+esc(f.l)+'</span><button class="chip" data-f="'+f.k+'" data-v="*" aria-pressed="'+(sel.length===all.length)+'">All</button>';
    all.forEach(function(x){ var n=v.rows.filter(function(r){return r[f.k]===x;}).length;
      h+='<button class="chip" data-f="'+f.k+'" data-v="'+esc(x)+'" aria-pressed="'+(sel.indexOf(x)>=0)+'">'+esc(x)+" <small>"+n+"</small></button>"; });
    return h+"</div>"; }).join(""); }
function renderCols(){ document.getElementById("colmenu").innerHTML=V().cols.map(function(c){
  return '<label><input type="checkbox" data-c="'+c.k+'"'+(S().hidden.indexOf(c.k)<0?" checked":"")+"> "+esc(c.l)+"</label>"; }).join(""); }
function renderHead(){ var vc=vis(), s=S(), h='<tr class="h">', f='<tr class="flt">';
  vc.forEach(function(c){ var nc=c.type==="name"?' class="namecol"':"";
    h+="<th"+nc+">"+(c.nosort?esc(c.l):'<button class="sort" data-k="'+c.k+'"'+(s.sort===c.k?' data-dir="'+s.dir+'"':"")+">"+esc(c.l)+"</button>")+"</th>";
    f+="<th"+nc+'><input class="f" data-k="'+c.k+'" value="'+esc(s.f[c.k]||"")+'" placeholder="'+(c.nf?"&gt;, &lt;, a-b":"filter")+'" aria-label="Filter '+esc(c.l)+'"></th>'; });
  thead.innerHTML=h+"</tr>"+f+"</tr>";
  var h1=thead.querySelector("tr.h"); if(h1) document.getElementById("t").style.setProperty("--h1",h1.getBoundingClientRect().height+"px"); }
function sorted(list){ var s=S(); if(!s.sort) return list; var c=V().cols.filter(function(x){return x.k===s.sort;})[0], d=s.dir==="asc"?1:-1;
  return list.slice().sort(function(a,b){ if(c.num){ var x=numOf(a,c), y=numOf(b,c); if(x==null&&y==null) return 0; if(x==null) return 1; if(y==null) return -1; return (x-y)*d; }
    return text(a,c).localeCompare(text(b,c))*d; }); }
function renderBody(){ var v=V(), s=S(), vc=vis(), list=sorted(v.rows.filter(keep)), out="";
  function rowHtml(r){ var vals=SCORE.map(function(k){return r[k];}).filter(function(x){return x!=null;}), mx=vals.length?Math.max.apply(null,vals):null;
    return '<tr class="'+v.rowClass(r)+'">'+vc.map(function(c){return cell(r,c,mx);}).join("")+"</tr>"; }
  if(s.bygroup&&!s.sort){ values(v,v.groupBy).forEach(function(g){ var part=list.filter(function(r){return r[v.groupBy]===g;}); if(!part.length) return;
      out+='<tr class="sect"><td colspan="'+vc.length+'"><span class="lab">'+esc(g)+' <span class="note">('+part.length+")</span></span></td></tr>";
      part.forEach(function(r){ out+=rowHtml(r); }); }); }
  else list.forEach(function(r){ out+=rowHtml(r); });
  tbody.innerHTML=out||'<tr><td class="empty" colspan="'+vc.length+'">No row matches. Clear a filter or press Reset.</td></tr>';
  document.getElementById("count").textContent="Showing "+list.length+" of "+v.rows.length; }
function save(){ var s=S(), v=V(), d=fresh(CUR), o={v:CUR};
  v.facets.forEach(function(f){ if(s.sel[f.k].length!==d.sel[f.k].length) o["g."+f.k]=s.sel[f.k].join("|"); });
  if(s.q) o.q=s.q; if(s.sort){o.s=s.sort;o.d=s.dir;} if(!s.bygroup) o.flat="1";
  if(JSON.stringify(s.hidden)!==JSON.stringify(d.hidden)) o.h=s.hidden.join("|");
  for(var k in s.f) if(s.f[k]) o["f."+k]=s.f[k];
  var q=new URLSearchParams(o).toString(); history.replaceState(null,"",CUR==="survey"&&q==="v=survey"?location.pathname+location.search:"#"+q); }
function load(){ var p=new URLSearchParams(location.hash.slice(1)); if(p.get("v")&&VIEWS[p.get("v")]) CUR=p.get("v");
  var s=STATE[CUR], v=V();
  v.facets.forEach(function(f){ var x=p.get("g."+f.k); if(x!=null){ var all=values(v,f.k); s.sel[f.k]=x.split("|").filter(function(g){return all.indexOf(g)>=0;}); } });
  if(p.get("q")) s.q=p.get("q"); if(p.get("s")){s.sort=p.get("s");s.dir=p.get("d")==="desc"?"desc":"asc";}
  if(p.get("flat")) s.bygroup=false; if(p.get("h")!=null) s.hidden=p.get("h").split("|").filter(Boolean);
  p.forEach(function(val,k){ if(k.indexOf("f.")===0) s.f[k.slice(2)]=val; }); }
function all(){ renderTabs(); renderHeader(); renderFacets(); renderCols(); renderHead(); renderBody();
  document.getElementById("q").value=S().q; document.getElementById("bygroup").checked=S().bygroup; save(); }
function go(id){ CUR=id; document.querySelector("details.cols").open=false; all(); }
document.getElementById("tabs").addEventListener("click",function(e){ var b=e.target.closest("button[data-top]"); if(!b) return;
  var t=TOPS.filter(function(x){return x.id===b.getAttribute("data-top");})[0]; if(V().top!==t.id) go(t.subs[0]); });
document.getElementById("subtabs").addEventListener("click",function(e){ var b=e.target.closest("button[data-view]"); if(b) go(b.getAttribute("data-view")); });
document.getElementById("facets").addEventListener("click",function(e){ var b=e.target.closest("button.chip"); if(!b) return;
  var k=b.getAttribute("data-f"), x=b.getAttribute("data-v"), s=S(), everything=values(V(),k);
  if(x==="*") s.sel[k]=s.sel[k].length===everything.length?[]:everything.slice();
  else { var i=s.sel[k].indexOf(x); if(i>=0) s.sel[k].splice(i,1); else s.sel[k].push(x); }
  renderFacets(); renderBody(); save(); });
document.getElementById("q").addEventListener("input",function(e){ S().q=e.target.value; renderBody(); save(); });
document.getElementById("bygroup").addEventListener("change",function(e){ S().bygroup=e.target.checked; renderBody(); save(); });
document.getElementById("colmenu").addEventListener("change",function(e){ var k=e.target.getAttribute("data-c"), s=S(), i=s.hidden.indexOf(k);
  if(e.target.checked&&i>=0) s.hidden.splice(i,1); else if(!e.target.checked&&i<0) s.hidden.push(k); renderHead(); renderBody(); save(); });
thead.addEventListener("click",function(e){ var b=e.target.closest("button.sort"); if(!b) return; var k=b.getAttribute("data-k"), s=S();
  if(s.sort===k){ if(s.dir==="asc") s.dir="desc"; else { s.sort=null; s.dir="asc"; } } else { s.sort=k; s.dir="asc"; }
  renderHead(); renderBody(); save(); });
thead.addEventListener("input",function(e){ if(!e.target.classList.contains("f")) return; S().f[e.target.getAttribute("data-k")]=e.target.value; renderBody(); save(); });
document.getElementById("reset").addEventListener("click",function(){ STATE[CUR]=fresh(CUR); all(); });
load(); all();
})();
</script>
</body>
